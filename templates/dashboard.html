<!DOCTYPE html>
<html>
<head>
    <title>AgriTrack Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial; background:#f4f6f9; margin:0; }

        .header {
            background:#1f4e3d;
            color:white;
            padding:20px;
            text-align:center;
        }

        .container { padding:20px; }

        .cards { display:flex; gap:15px; flex-wrap:wrap; }

        .card {
            background:white;
            padding:15px;
            border-radius:10px;
            flex:1;
            min-width:200px;
            box-shadow:0 2px 6px rgba(0,0,0,0.1);
        }

        table {
            width:100%;
            margin-top:20px;
            border-collapse:collapse;
            background:white;
        }

        th { background:#1f4e3d; color:white; padding:10px; }
        td { padding:10px; text-align:center; border-bottom:1px solid #ddd; }

        .chart {
            margin-top:30px;
            background:white;
            padding:20px;
            border-radius:10px;
        }
    </style>

</head>

<body>

<div class="header">
    <h1>AgriTrack Dashboard</h1>
</div>

<div class="container">

    <div class="cards">
        <div class="card">Total : {{ total }}</div>
        <div class="card">Production : {{ total_quantite }} t</div>
        <div class="card">Rendement : {{ rendement }}</div>
    </div>

    <h2>Données</h2>

    <table border="1">
        <tr>
            <th>ID</th><th>Culture</th><th>Surface</th><th>Quantité</th><th>Pluie</th><th>Date</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="chart">
        <h2>Production par culture</h2>
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
const labels = [{% for i in stats %}"{{ i[0] }}",{% endfor %}];
const values = [{% for i in stats %}{{ i[1] }},{% endfor %}];

new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Production",
            data: values
        }]
    }
});
</script>

</body>
</html>
