<!DOCTYPE html>
<html>
<head>
    <title>AgriTrack - Collecte</title>
</head>
<body>

<h2>Formulaire de collecte agricole</h2>

<form action="/submit" method="post">

    Culture :
    <input type="text" name="nom_culture" required><br><br>

    Surface (ha) :
    <input type="number" step="0.1" name="surface" required><br><br>

    Quantité (tonnes) :
    <input type="number" step="0.1" name="quantite" required><br><br>

    Pluie (mm) :
    <input type="number" step="0.1" name="pluie" required><br><br>

    Date :
    <input type="date" name="date" required><br><br>

    <button type="submit">Enregistrer</button>

</form>

</body>
</html>
